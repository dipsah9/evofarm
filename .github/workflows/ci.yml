name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    name: API (Go) — Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: api/go.sum

      - name: Download dependencies
        working-directory: api
        run: go mod download

      - name: Run unit tests
        working-directory: api
        run: go test ./... -v

  api-integration:
    name: API (Go) — Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: evofarm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: api/go.sum

      - name: Download dependencies
        working-directory: api
        run: go mod download

      - name: Apply schema to test database
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -d evofarm_test -f docs/schema.sql

      - name: Run integration tests
        working-directory: api
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/evofarm_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: integration-test-secret-do-not-use-in-prod
        run: go test -tags=integration ./... -v

  worker-tests:
    name: Worker (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: worker
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.3.3

      - name: Run tests
        working-directory: worker
        run: pytest tests/ -v