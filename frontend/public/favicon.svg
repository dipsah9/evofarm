<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="strandA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="strandB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fa4ff"/>
      <stop offset="100%" stop-color="#b794f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0a0e1a"/>

  <!-- Rungs (base pairs) -->
  <g opacity="0.35" stroke="url(#strandA)" stroke-width="2" stroke-linecap="round">
    <line x1="20" y1="14" x2="44" y2="14"/>
    <line x1="16" y1="22" x2="48" y2="22"/>
    <line x1="14" y1="32" x2="50" y2="32"/>
    <line x1="16" y1="42" x2="48" y2="42"/>
    <line x1="20" y1="50" x2="44" y2="50"/>
  </g>

  <!-- Strand A (left-leaning) -->
  <path
    d="M 26 8 Q 44 20 26 32 Q 8 44 26 56"
    stroke="url(#strandA)"
    stroke-width="4"
    fill="none"
    stroke-linecap="round"
  />

  <!-- Strand B (right-leaning) -->
  <path
    d="M 38 8 Q 20 20 38 32 Q 56 44 38 56"
    stroke="url(#strandB)"
    stroke-width="4"
    fill="none"
    stroke-linecap="round"
  />
</svg>